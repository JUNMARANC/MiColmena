
# ==========================================================
# MI COLMENA - DESPLIEGUE AUTOMÁTICO EN AZURE APP SERVICE
# ==========================================================

name: Build and deploy Python app to Azure Web App - MiColmena

# Ejecutar al actualizar master o manualmente desde GitHub
on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:

  # ========================================================
  # 1. CONSTRUCCIÓN Y VALIDACIÓN
  # ========================================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Descargar código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Instalar bibliotecas necesarias para compilar mysqlclient
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      # Crear entorno virtual e instalar dependencias
      - name: Install Python dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Preparar paquete para Azure sin incluir respaldos
      # Los archivos ocultos se excluyen por defecto.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !colmena/backups/**
            !colmena/database/**
            !**/*.sql
            !**/*.bak
            !**/*.key
            !**/*.pfx
            !**/__pycache__/**
            !**/*.pyc

  # ========================================================
  # 2. PUBLICACIÓN EN AZURE
  # ========================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # Descargar el paquete preparado
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Autenticarse en Azure mediante GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7449429792294AC6B58478CD9942979B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E89E7BE9AEF34743B69279B1E52043CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F6E095F8AA1E4992A76695EDA1013416 }}

      # Publicar aplicación Django en Azure App Service
      - name: Deploy MiColmena to Azure
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'MiColmena'
          slot-name: 'Production'

