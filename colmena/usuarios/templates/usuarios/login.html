{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Mi Colmena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
</head>

<body>

<div class="login-page">

    <section class="login-welcome">
        <div class="brand">
            <i class="bi bi-bug-fill"></i>
            <span>Mi Colmena</span>
        </div>

        <div class="welcome-content">
            <h1>¡Bienvenido!</h1>
            <div class="bee-icon">
                <i class="bi bi-bug-fill"></i>
            </div>
            <p>Gestiona tus apiarios, colmenas y mantenimientos en un solo lugar.</p>
        </div>
    </section>

    <section class="login-card">

        <a href="{% url 'Inicio' %}" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>

        <div class="login-header">
            <h2>Login</h2>
            <p>Ingresa tus credenciales para acceder a tu cuenta.</p>
        </div>

        {% if error %}
            <div class="alert-error">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Usuario</label>
                <div class="input-icon">
                    <i class="bi bi-person"></i>
                    <input type="text" name="username" placeholder="Nombre de usuario" required>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" id="passwordInput" placeholder="Contraseña" required>
                    <button type="button" class="btn-eye" id="btnPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="forgot">
                <a href="#">¿Olvidó su contraseña?</a>
            </div>

            <button type="submit" class="btn-login">
                Ingresar
            </button>
        </form>

    </section>

</div>

<script src="{% static 'usuarios/js/login.js' %}"></script>
</body>
</html>
